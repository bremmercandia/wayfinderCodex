# Local development environment for WayfinderCodex.
#
#   docker compose up
#
# The dev server is published on http://localhost:8080 with HMR enabled.
services:
  wayfindercodex:
    image: node:22-alpine
    container_name: wayfindercodex-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 8080"
    environment:
      NODE_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      # Keep the container's own dependency tree out of the bind mount.
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules: